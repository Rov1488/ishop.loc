[ishop.loc]

aliases           = www.ishop.loc
enabled           = on
environment       = System
http_port         = 80
https_port        = 443
ip                = auto
nginx_engine      = Nginx-1.26
php_engine        = PHP-8.2-FCGI
project_dir       = {base_dir}
project_url       = https://ishop.loc
public_dir        = {base_dir}\public
ssl               = on
ssl_cert_file     = auto
ssl_key_file      = auto
start_command     =
terminal_codepage = 65001


